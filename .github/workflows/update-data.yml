name: Update plugin data

on:
  schedule:
    # Every 6 hours. Data is committed before the build/deploy stages so a
    # build failure cannot destroy the newly collected snapshot.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    name: Collect GitHub, npm and OSV data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data-store
          persist-credentials: false

      - name: Collect data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect -- --data-dir data-store

      - name: Stage data artifact
        run: |
          mkdir -p artifact-data
          cp data-store/latest.json artifact-data/
          cp data-store/history.json artifact-data/
          cp data-store/status.json artifact-data/
          cp -R data-store/snapshots artifact-data/

      - name: Upload data artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-data
          path: artifact-data/
          retention-days: 3

      - name: Run summary
        if: always()
        run: |
          echo "### DSH Plugin Health Monitor data update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifact-data/status.json ]; then
            node -e "const s=require('./artifact-data/status.json'); const safe=(v)=>String(v).replace(/[<>]/g,''); console.log('- outcome: **'+safe(s.outcome)+'**'); console.log('- last success: '+safe(s.lastSuccessAt)); console.log('- errors: '+Number(s.errorCount)); for (const [k,v] of Object.entries(s.sources)) console.log('- '+safe(k)+': '+safe(v.status));" >> "$GITHUB_STEP_SUMMARY"
          fi

  persist:
    name: Persist snapshot to data branch
    runs-on: ubuntu-latest
    needs: collect
    permissions:
      contents: write
    steps:
      - name: Checkout data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data-store

      - name: Download data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-data
          path: downloaded-data

      - name: Commit and push snapshot
        working-directory: data-store
        run: |
          cp ../downloaded-data/latest.json .
          cp ../downloaded-data/history.json .
          cp ../downloaded-data/status.json .
          rm -rf snapshots
          cp -R ../downloaded-data/snapshots .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json history.json status.json snapshots
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: collect
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-data
          path: artifact-data

      - name: Build static site
        env:
          DATA_SOURCE: artifact-data
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Check build for secrets
        run: npm run check:dist

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: dist/
          retention-days: 3

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: [persist, build]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-dist
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
