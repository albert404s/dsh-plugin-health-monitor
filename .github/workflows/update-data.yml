name: Update plugin data

on:
  schedule:
    # The gate checks the data branch before any provider API is called.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'refresh: collect once; pause/resume: change future automatic updates'
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - pause
          - resume

permissions:
  contents: read

# Shared with deploy.yml: data and Pages changes are serialized.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Check collection controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      action: ${{ steps.control.outputs.action }}
      should_collect: ${{ steps.control.outputs.should_collect }}
      control_changed: ${{ steps.control.outputs.control_changed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data-store
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Decide collection action
        id: control
        env:
          COLLECTION_EVENT: ${{ github.event_name }}
          COLLECTION_ACTION: ${{ inputs.action }}
        run: node scripts/collection-control.ts gate --data-dir data-store

      - name: Stage existing data for control-only deployment
        if: steps.control.outputs.control_changed == 'true'
        run: node scripts/collection-control.ts stage --data-dir data-store --artifact-dir artifact-data

      - name: Upload control-only data artifact
        if: steps.control.outputs.control_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-data
          path: artifact-data/
          retention-days: 3

  collect:
    name: Collect GitHub, npm and OSV data
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_collect == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data-store
          persist-credentials: false

      - name: Collect data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run collect -- --data-dir data-store

      - name: Stage data artifact
        run: node scripts/collection-control.ts stage --data-dir data-store --artifact-dir artifact-data

      - name: Upload data artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-data
          path: artifact-data/
          retention-days: 3

      - name: Run summary
        if: always()
        run: |
          echo "### ORBIT data update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifact-data/status.json ]; then
            node -e "const s=require('./artifact-data/status.json'); const safe=(v)=>String(v).replace(/[<>]/g,''); console.log('- outcome: **'+safe(s.outcome)+'**'); console.log('- last success: '+safe(s.lastSuccessAt)); console.log('- errors: '+Number(s.errorCount)); for (const [k,v] of Object.entries(s.sources)) console.log('- '+safe(k)+': '+safe(v.status));" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: [gate, collect]
    # collect is deliberately skipped for pause/resume; a paused schedule has no artifact.
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
      (needs.collect.result == 'success' || needs.gate.outputs.control_changed == 'true') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Download data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-data
          path: artifact-data

      - name: Build static site
        env:
          DATA_SOURCE: artifact-data
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Check build for secrets
        run: npm run check:dist

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: dist/
          retention-days: 3

  persist:
    name: Persist data or control change
    runs-on: ubuntu-latest
    needs: [gate, collect, build]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data-store

      - name: Download data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-data
          path: downloaded-data

      - name: Commit and push data change
        working-directory: data-store
        env:
          CONTROL_ONLY: ${{ needs.gate.outputs.control_changed }}
        run: |
          cp ../downloaded-data/collection-control.json .
          git add collection-control.json
          if [ "$CONTROL_ONLY" != "true" ]; then
            cp ../downloaded-data/latest.json .
            cp ../downloaded-data/history.json .
            cp ../downloaded-data/status.json .
            rm -rf snapshots
            cp -R ../downloaded-data/snapshots .
            git add latest.json history.json status.json snapshots
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update snapshot or collection control $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:data
          fi

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: [persist, build]
    if: ${{ !cancelled() && needs.persist.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-dist
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
